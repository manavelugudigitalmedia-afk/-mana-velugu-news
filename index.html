<!doctype html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mana Velugu Digital Media</title><meta name="description" content="మన వెలుగు డిజిటల్ మీడియా తెలుగు వార్తలు"><style>
:root{--orange:#f28c00;--yellow:#ffd33d;--ink:#202020;--muted:#666;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Telugu",sans-serif;color:var(--ink);background:#f6f6f6}.top{background:linear-gradient(110deg,#f28c00,#ffd33d);padding:22px 16px;text-align:center}.brand{font-size:clamp(26px,5vw,42px);font-weight:800;margin:0}.tag{margin:6px 0 0}.nav{background:#222;color:white;padding:11px 16px;text-align:center}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.status{background:#fff3d0;border:1px solid #f0d68b;border-radius:8px;padding:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 7px #0000000a}.card img,.card video{width:100%;max-height:270px;object-fit:cover;background:#eee;display:block}.body{padding:15px}.date{font-size:12px;color:var(--muted)}h2{font-size:21px;line-height:1.45;margin:8px 0}.details{line-height:1.7;white-space:pre-wrap}.link{display:inline-block;margin-top:12px;background:#f28c00;color:#171717;padding:9px 13px;border-radius:5px;text-decoration:none;font-weight:bold}.empty{text-align:center;padding:30px;background:#fff;border-radius:10px;color:var(--muted)}footer{text-align:center;padding:25px;color:#666;font-size:13px}@media(max-width:500px){.top{padding:18px 10px}}
</style></head><body><header class="top"><h1 class="brand">మన వెలుగు</h1><p class="tag">Mana Velugu Digital Media · ప్రతి అక్షరం జనం కోసం</p></header><div class="nav">తెలుగు వార్తలు | స్థానికం | రాష్ట్రం | దేశం | వీడియోలు</div><main class="wrap"><div id="status" class="status">వార్తలను లోడ్ చేస్తోంది…</div><div id="news" class="grid"></div></main><footer>© Mana Velugu Digital Media</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(async()=>{const status=document.getElementById('status'),root=document.getElementById('news');const c=window.MV_CONFIG||{};if(!c.supabaseUrl||!c.supabaseKey||c.supabaseUrl.includes('PASTE_')||c.supabaseKey.includes('PASTE_')){status.textContent='వెబ్‌సైట్ కనెక్షన్ ఇంకా సెటప్ కాలేదు. config.js లో కొత్త Supabase URL మరియు Publishable/anon key ఇవ్వాలి.';return}const sb=window.supabase.createClient(c.supabaseUrl,c.supabaseKey);try{const {data,error}=await sb.from('news_articles').select('id,title,details,news_url,image_url,video_url,created_at').eq('published',true).order('created_at',{ascending:false});if(error)throw error;status.textContent=data.length?`తాజా వార్తలు: ${data.length}`:'ప్రస్తుతం ప్రచురించిన వార్తలు లేవు.';root.innerHTML='';for(const n of data){const card=document.createElement('article');card.className='card';let media='';if(n.image_url)media+=`<img src="${esc(n.image_url)}" alt="వార్త ఫోటో" loading="lazy">`;if(n.video_url)media+=`<div class="body"><video src="${esc(n.video_url)}" controls playsinline></video></div>`;card.innerHTML=media+`<div class="body"><div class="date">${new Date(n.created_at).toLocaleDateString('te-IN')}</div><h2>${esc(n.title)}</h2><div class="details">${esc(n.details||'')}</div>${n.news_url?`<a class="link" href="${esc(n.news_url)}" target="_blank" rel="noopener">పూర్తి వార్త చదవండి</a>`:''}</div>`;root.appendChild(card)}}catch(e){status.textContent='వార్తలను లోడ్ చేయలేకపోయాం. Supabase SQL మరియు కనెక్షన్ సెట్టింగులు పరిశీలించండి.';console.error(e)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();
</script></body></html>
